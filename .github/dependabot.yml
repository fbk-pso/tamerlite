version: 2
updates:
  # Python deps from pyproject.toml / uv.lock.
  #
  # unified-planning is ignored below. It is declared as a git URL, but
  # Dependabot's uv updater version-checks it against PyPI rather than the git
  # repository. The bump-unified-planning workflow tracks master commits instead.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # Handled by the bump-unified-planning workflow.
      - dependency-name: "unified-planning"

  # Rust deps from Cargo.toml / Cargo.lock across the workspace.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"

  # rust-toolchain.toml channel pin (rustc/cargo version).
  - package-ecosystem: "rust-toolchain"
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"

  # Pinned action versions in .github/workflows/. Batched into a single PR per
  # week to cut review noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
